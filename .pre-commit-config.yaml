# Local hooks (https://pre-commit.com): `pre-commit install` once per clone installs both hook types.
# ggshield scans the staged changes (pre-commit) and the commits about to be pushed (pre-push; in a public
# repository a push publishes them) with .gitguardian.yaml. scripts/ggshield_hook.py runs the ggshield on
# PATH only at the version runtime/ggshield-requirements.lock pins (install it from that file), and
# ggshield needs a GitGuardian API key (GITGUARDIAN_API_KEY, or `ggshield auth login`).
# See CONTRIBUTING.md#secret-scanning.
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: ggshield
        name: ggshield (secret scan of the staged changes)
        entry: python3 scripts/ggshield_hook.py pre-commit
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: ggshield-push
        name: ggshield (secret scan of the commits to push)
        entry: python3 scripts/ggshield_hook.py pre-push
        language: system
        pass_filenames: false
        stages: [pre-push]
