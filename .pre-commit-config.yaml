# Local hooks (https://pre-commit.com): `pre-commit install` once per clone.
# ggshield scans the staged changes for secrets with .gitguardian.yaml. The hook runs the ggshield on PATH,
# installed from runtime/ggshield-requirements.lock, and needs a GitGuardian API key
# (GITGUARDIAN_API_KEY, or `ggshield auth login`). See CONTRIBUTING.md#secret-scanning.
repos:
  - repo: local
    hooks:
      - id: ggshield
        name: ggshield (secret scan of the staged changes)
        entry: ggshield secret scan pre-commit
        language: system
        pass_filenames: false
        stages: [pre-commit]
