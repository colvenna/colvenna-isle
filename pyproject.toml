[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "colvenna-isle"
dynamic = ["version"]
description = "Durable analytics databases on S3; versioned contracts and control metadata"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["jsonschema==4.25.1", "PyYAML==6.0.1"]

[project.optional-dependencies]
aws = ["boto3==1.42.89"]

[project.urls]
Repository = "https://github.com/colvenna/colvenna-isle"

[tool.setuptools.dynamic]
version = {attr = "colvenna_isle._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"colvenna_isle.contracts" = ["v2/*.json"]

"colvenna_isle.control" = ["data/*.json"]
