# ggshield settings (GitGuardian's command-line scanner, configuration version 2):
# https://docs.gitguardian.com/ggshield-docs/configuration
# The backfill scan of 2026-11-04 (https://github.com/colvenna/colvenna-isle/issues/25), which also covered
# the issue and pull-request text, found nothing in the history, the release assets or that text. Its 8
# findings are in the workflow artifacts: examples of the AWS API documentation in botocore 1.42.89, which
# control.zip bundles, each file identical to the botocore wheel on PyPI. None is a credential.
# Each is ignored by its ignore SHA, ggshield's SHA-256 of the matched string and its type
# (get_ignore_sha, https://github.com/GitGuardian/ggshield/blob/v1.56.1/ggshield/core/filter.py), so
# this file holds no value. Nothing else is ignored, no path and no detector: any other value is
# reported. Add an entry only for a value checked by hand and reviewed in its pull request
# (CONTRIBUTING.md#secret-scanning); a real credential is revoked or rotated, never ignored.
version: 2
secret:
  ignored_matches:
    - name: "an example password of the AWS API documentation that botocore 1.42.89 ships, identical to its PyPI wheel; in control.zip (Generic Password; botocore/data/iam/2010-05-08/examples-1.json, line 1155)"
