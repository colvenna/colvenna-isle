name: Colvenna Isle secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ggshield:
    name: Scan for secrets with ggshield
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the publication scan's local seams
        run: python3 -m unittest discover -s tests/ggshield_scan -v
      - name: Install hash-locked ggshield
        run: |
          python3 -m venv "$RUNNER_TEMP/ggshield"
          "$RUNNER_TEMP/ggshield/bin/python" -m pip install --require-hashes --only-binary=:all: \
            -r runtime/ggshield-requirements.lock
      - name: Scan with the repository's .gitguardian.yaml
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
          FROM_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          # ggshield's commit range: a pull request's base branch, else the commits of the push
          # (GITHUB_PUSH_BASE_SHA), else everything not on the default branch. The push's base is
          # dropped below when the checkout lacks it: a new branch (all zeros) or a force push.
          GITHUB_PUSH_BASE_SHA: ${{ github.event.before }}
          GITHUB_DEFAULT_BRANCH: origin/${{ github.event.repository.default_branch }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$GITGUARDIAN_API_KEY" ]; then
            if [ "$FROM_FORK" = true ]; then
              echo "::notice::A pull request from a fork gets no secrets: a maintainer scans it before merging (CONTRIBUTING.md#secret-scanning)."
              exit 0
            fi
            echo "::error::The GITGUARDIAN_API_KEY Actions secret is not set (CONTRIBUTING.md#secret-scanning)."
            exit 1
          fi
          if [ -n "$GITHUB_PUSH_BASE_SHA" ] && ! git cat-file -e "$GITHUB_PUSH_BASE_SHA^{commit}" 2>/dev/null; then
            unset GITHUB_PUSH_BASE_SHA
          fi
          if [ "$EVENT" = workflow_dispatch ]; then
            "$RUNNER_TEMP/ggshield/bin/ggshield" secret scan repo .
          else
            "$RUNNER_TEMP/ggshield/bin/ggshield" secret scan ci
          fi
